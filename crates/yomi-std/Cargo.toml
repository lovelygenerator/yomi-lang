[package]
name = "yomi-std"
description = "Standard packages for the yomi scripting language: flow, math, text, json, audio, image, screen, input, event"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["scripting", "language", "embedded", "save", "dialogue"]
categories = ["game-development"]

[lints]
workspace = true

[dependencies]
yomi-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "unbounded_depth"] }
