[package]
name = "yomi-cli"
description = "yomi 言語の CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["scripting", "language", "lsp", "mcp", "repl"]
categories = ["command-line-utilities", "development-tools"]

[lints]
workspace = true

[[bin]]
name = "yomi"
path = "src/main.rs"

[features]
default = ["mcp", "lsp"]
# `yomi mcp`（MCP サーバー）。切ると rmcp・tokio などの依存が入らない
# `yomi lsp`（Language Server。標準入出力で話す）
lsp = ["dep:lsp-server", "dep:lsp-types"]
mcp = ["dep:rmcp", "dep:schemars", "dep:serde", "dep:tokio", "dep:tempfile", "dep:job-limits", "lingokit/rmcp"]

[dependencies]
serde_json = "1"
yomi-core.workspace = true
yomi-std.workspace = true
clap = { version = "4", features = ["derive"] }
notify = "9"
lingokit = { version = "0.1", features = ["clap"] }
lsp-server = { version = "0.10", optional = true }
lsp-types = { version = "0.97", optional = true }
rmcp = { version = "~3.10", features = ["server", "macros", "transport-io"], optional = true }
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
tempfile = { version = "3", optional = true }
job-limits = { version = "0.1", features = ["tokio"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "time"], optional = true }

[build-dependencies]
lingokit-build = "0.1"

[dev-dependencies]
tempfile = "3"
